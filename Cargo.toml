[package]
name = "voxel-game"
version = "0.1.0"
edition = "2021"
description = "Minecraft-like voxel survival game"
repository = ""

[dependencies]
# Pinned per docs/architecture.md; upgrades are architectural changes.
bevy = "0.18"
# Serialization (architecture §5).
serde = { version = "1", features = ["derive"] }
bincode = "1"
# Math (architecture §6); Bevy re-exports glam.
glam = "0.28"
# Procedural generation (architecture §6).
rand = "0.8"
noise = "0.8"
# Logging (architecture §6); Bevy uses tracing.
tracing = "0.1"
